[project]
name = "nikke-affix-bot"
version = "2.1.0"
description = "NIKKE T10 装备词条管理 QQ 机器人"
requires-python = ">=3.12"

dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
ocr = ["paddleocr>=2.8.0", "paddlepaddle>=3.0.0"]
vision = ["openai>=1.0.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "pytest-cov>=5.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
